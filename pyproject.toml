[project]
name = "profmute"
version = "1.2.0"
description = "Mute profanity in a video's audio track (faster-whisper + ffmpeg)"
requires-python = "==3.12.*"
dependencies = [
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.2",
    "av==19.0.1",
    "numpy==2.5.4",
    "nvidia-cublas-cu12==12.9.2.10",
    "nvidia-cudnn-cu12==9.27.0.42",
    "nvidia-cuda-nvrtc-cu12==12.9.86",
    # the AI voice models (voice_separation/)
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "einops==0.8.1",
    "rotary-embedding-torch==0.9.1",
    "beartype==0.23.1",
    "librosa==1.0.0",
    "pyyaml==6.0.3",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32'"]   # ProfMute is a Windows program

# PyTorch with NVIDIA graphics card support comes from PyTorch's own package index (it also runs on the processor).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
