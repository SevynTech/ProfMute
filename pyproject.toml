requires-python = "==3.12.*"
dependencies = [
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.2",
    "av==19.0.1",
    "numpy==2.5.4",
    "nvidia-cublas-cu12==12.9.2.10",
    "nvidia-cudnn-cu12==9.27.0.42",
    "nvidia-cuda-nvrtc-cu12==12.9.86",
]

[tool.uv]
package = false
